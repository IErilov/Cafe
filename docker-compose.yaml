services:
  db:
    image: postgres:15-alpine
    container_name: cafe_db
    restart: always
    environment:
      POSTGRES_USER: user_cafe
      POSTGRES_PASSWORD: password_cafe
      POSTGRES_DB: cafe_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cafe_network

  backend:
    build: ./Backend
    container_name: cafe_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://user_cafe:password_cafe@db:5432/cafe_database"
      ADMIN_PASSWORD: "123"
      SECRET_KEY: "cd5f04cb57a19c3c7e7bd3078d4c3e3799a532540abedef896d0aa2aec8a1260"
    depends_on:
      - db
    networks:
      - cafe_network

volumes:
  postgres_data:

networks:
  cafe_network:
    driver: bridge